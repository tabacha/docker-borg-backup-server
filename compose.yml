services:
  borg-server:
    # Vorgebautes Image von GHCR - "docker compose pull" statt selbst
    # bauen. "build: ." bleibt als Fallback (z.B. für lokale Änderungen
    # am Dockerfile, oder falls die Registry nicht erreichbar ist).
    image: ghcr.io/tabacha/docker-borg-backup-server:latest
    build: .

    restart: unless-stopped

    ports:
      - "${SSH_PORT:-2222}:22"

    environment:
      # Alle vier optional - unbelegt kommen die engen Defaults aus
      # sshd_config.template zum Einsatz. Siehe README "SSH-Haertung".
      SSHD_PUBKEY_ALGORITHMS: "${SSHD_PUBKEY_ALGORITHMS:-}"
      SSHD_KEX_ALGORITHMS: "${SSHD_KEX_ALGORITHMS:-}"
      SSHD_CIPHERS: "${SSHD_CIPHERS:-}"
      SSHD_MACS: "${SSHD_MACS:-}"

    volumes:
      - borg-data:/data
      - ./secrets/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./keys/backup:/keys/backup:ro
      - ./keys/admin:/keys/admin:ro
      # Optionaler zweiter Modus: liegt hier eine Datei "authorized_keys",
      # wird die 1:1 uebernommen und keys/backup/+keys/admin/ ignoriert -
      # siehe README "Manueller Modus".
      - ./keys/manual:/keys/manual:ro

volumes:
  borg-data:
