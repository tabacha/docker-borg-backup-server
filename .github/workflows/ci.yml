name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning -- *.sh image/*.sh .github/scripts/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        run: |
          docker run --rm -v "$(pwd):/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color

      - name: compose.yml - mit .env muss es funktionieren
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ci-test:local .

      - name: Funktionstest (echter sshd + borg serve Zyklus)
        run: .github/scripts/functional-test.sh ci-test:local
